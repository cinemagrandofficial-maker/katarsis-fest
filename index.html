<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>КАТАРСИС fest.</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --acid: #d8ff00;
            --bg: #030508;
            --text: #f2f2f2;
            --muted: #8b8e94;
            --border: rgba(216, 255, 0, 0.35);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 90% 5%,
                    rgba(216, 255, 0, 0.22),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 20%,
                    rgba(255, 0, 90, 0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 10% 75%,
                    rgba(0, 210, 255, 0.14),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .noise {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.035;
            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
            z-index: 10;
        }

        .app {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 18px 40px;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
        }

        .logo {
            color: var(--acid);
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 7px;
        }

        .fest {
            color: var(--acid);
            font-size: 12px;
            letter-spacing: 5px;
            margin-top: 5px;
        }

        .date {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 2px;
            text-align: right;
        }

        .hero {
            min-height: 65vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .eyebrow {
            color: var(--acid);
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(54px, 15vw, 88px);
            line-height: 0.82;
            font-weight: 400;
            letter-spacing: -5px;
            margin-bottom: 28px;
        }

        h1 span {
            display: block;
            color: var(--acid);
        }

        .description {
            max-width: 420px;
            color: #c5c7cb;
            font-size: 16px;
            line-height: 1.55;
            margin-bottom: 32px;
        }

        .location {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 28px;
        }

        .buy {
            width: 100%;
            border: 1px solid var(--acid);
            background: var(--acid);
            color: #050600;
            padding: 19px 20px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.2s;
        }

        .buy:active {
            transform: scale(0.98);
        }

        .price {
            margin-top: 10px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 2px;
            text-align: center;
        }

        .menu {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-item {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 0;

            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.14);

            color: var(--text);
            text-align: left;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .menu-item span:last-child {
            color: var(--acid);
            font-size: 18px;
        }

        .coming {
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 2px;
        }

        footer {
            margin-top: 70px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #555960;
            font-size: 9px;
            letter-spacing: 3px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="noise"></div>

<main class="app">

    <header>
        <div>
            <div class="logo">КАТАРСИС</div>
            <div class="fest">ФЕСТ ───</div>
        </div>

        <div class="date">
            26 СЕНТЯБРЯ<br>
            МОСКВА
        </div>
    </header>


    <section class="hero">

        <div class="eyebrow">КАТАРСИС FEST.</div>

        <h1>
            МУЗЫКА.
            <span>СТИЛЬ.</span>
            ИСКУССТВО.
        </h1>

        <p class="description">
            Мы выросли из локальных тусовок и запускаем
            полноценный фестиваль, где музыка, стиль
            и искусство сходятся в одной точке.
        </p>

        <div class="location">
            26 СЕНТЯБРЯ · МОСКВА · ПОЛЯНА
        </div>

        <button class="buy">
            КУПИТЬ БИЛЕТ
        </button>

        <div class="price">
            БИЛЕТ — 1590 ₽
        </div>

    </section>


    <nav class="menu">

        <button class="menu-item">
            <span>ГЛАВНАЯ СЦЕНА</span>
            <span>→</span>
        </button>

        <button class="menu-item">
            <span>КИНОПОКАЗЫ</span>
            <span class="coming">COMING SOON</span>
        </button>

        <button class="menu-item">
            <span>АРТ-ПРОСТРАНСТВО</span>
            <span class="coming">COMING SOON</span>
        </button>

        <button class="menu-item">
            <span>КАК ДОБРАТЬСЯ</span>
            <span>→</span>
        </button>

    </nav>


    <footer>
        КАТАРСИС FEST. · 2026
    </footer>

</main>

</body>
</html>
